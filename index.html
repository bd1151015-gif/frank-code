<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林嘉德 | 個人簡歷</title>
    
    <!-- Google Fonts: Noto Sans TC for Chinese typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS for Animations and Gradients -->
    <style>
        body {
            /* Vibrant Gradient Background */
            background: linear-gradient(135deg, #38bdf8 0%, #c084fc 50%, #fb7185 100%);
            background-size: 200% 200%;
            animation: gradientMove 10s ease infinite;
        }

        /* Gradient Animation */
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Card Entrance Animation */
        .animate-float-up {
            opacity: 0;
            transform: translateY(40px);
            animation: floatUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes floatUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Interactive Element Bounce */
        .hover-bounce:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8 antialiased">

    <!-- Main Card Container -->
    <div class="animate-float-up bg-white/95 backdrop-blur-sm rounded-[2.5rem] shadow-2xl p-8 pt-24 max-w-sm sm:max-w-md w-full relative text-center border border-white/50">

        <div class="absolute -top-16 left-1/2 transform -translate-x-1/2 w-32 h-32 rounded-full border-[6px] border-white shadow-xl overflow-hidden bg-slate-100 z-10 hover:scale-105 transition-transform duration-300">

                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>

</body>
</html>
